name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo fmt --check
      - run: swift build --package-path app

  # The library crates declare Rust 1.85. This job is advisory until it has
  # been seen green once; make it required after that.
  msrv:
    name: msrv (library crates, Rust 1.85)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: >-
          cargo check --locked
          -p rushy-core -p rushy-config -p rushy-history -p rushy-bundles
          -p rushy-ai -p rushy-pty -p rushy-tui
